    <rect x="21" y="43" width="4.5" height="12" rx="2.25" />
    <path d="M16 57 C16 55 18 54 22 54 C26 54 27 55 27 57 L27 60 C27 60.8 26.2 61 25 61 L17 61 C16.2 61 16 60.8 16 60 Z" />
    <rect x="38.5" y="43" width="4.5" height="12" rx="2.25" />
    <path d="M37 57 C37 55 38 54 42 54 C46 54 48 55 48 57 L48 60 C48 60.8 47.2 61 46 61 L38 61 C37.2 61 37 60.8 37 60 Z" />
    <!-- Arms -->
    <rect x="8" y="27" width="3.5" height="8" rx="1.75" />
    <rect x="52.5" y="27" width="3.5" height="8" rx="1.75" />
    <!-- Main Body Chassis -->
    <g transform="translate(32, 26) scale(0.80) translate(-32, -32)">
      <path fill-rule="evenodd" clip-rule="evenodd" d="M53.06 23.44L58 32L45 54.52L19 54.52L6 32L19 9.48L45 9.48L48.25 15.11L42.48 21.11L40.38 17.48L23.62 17.48L15.24 32L23.62 46.52L40.38 46.52L48.76 32L45.58 26.48ZM47.85 17.56L30.03 29.11L33.97 34.89L51.23 22.52ZM25 32A7 7 0 0 1 39 32A7 7 0 0 1 25 32Z"/>
    </g>
  </g>
  <!-- Accent details: glowing orange antenna beacon & fuel core eyes -->
  <circle cx="32" cy="3.5" r="2.5" class="accent" />
  <g class="accent">
    <circle cx="30" cy="26" r="1.5" />
    <circle cx="34" cy="26" r="1.5" />
  </g>
</svg>