<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="OSSFuel Accent Bot">
  <title>OSSFuel Accent Bot</title>
  <style>
    .mark { fill: #0A0A0B; }
    .accent { fill: #FF5E36; }
    .eye { fill: #FFFFFF; }
