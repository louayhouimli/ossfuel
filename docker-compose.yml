services:
  postgres:
    image: postgres:16
    container_name: ossfuel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ossfuel
      POSTGRES_PASSWORD: ossfuel_dev
      POSTGRES_DB: ossfuel
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
